diabetes:
  dataset_path: datasets/Kaggle/diabetes.csv
  disease_name: Diabetes
  features:
  - label: Pregnancies
    max: 20
    min: 0
    name: Pregnancies
    type: int
    unit: count
  - label: Glucose Level
    max: 300
    min: 0
    name: Glucose
    type: float
    unit: mg/dL
  - label: Blood Pressure
    max: 200
    min: 0
    name: BloodPressure
    type: float
    unit: mmHg
  - label: Skin Thickness
    max: 100
    min: 0
    name: SkinThickness
    type: float
    unit: mm
  - label: Insulin Level
    max: 900
    min: 0
    name: Insulin
    type: float
    unit: mu U/ml
  - label: Body Mass Index (BMI)
    max: 70.0
    min: 0.0
    name: BMI
    type: float
    unit: "kg/m\xB2"
  - label: Diabetes Pedigree Function
    max: 3.0
    min: 0.0
    name: DiabetesPedigreeFunction
    type: float
    unit: score
  - label: Age
    max: 120
    min: 1
    name: Age
    type: int
    unit: years
  positive_label: 1
  target_column: Outcome
heart_disease:
  dataset_path: datasets/Kaggle/heart.csv
  disease_name: Heart Disease
  features:
  - label: Age
    max: 120
    min: 1
    name: age
    type: int
    unit: years
  - label: Sex (1 = Male, 0 = Female)
    max: 1
    min: 0
    name: sex
    type: int
    unit: binary
  - label: Chest Pain Type (0-3)
    max: 3
    min: 0
    name: cp
    type: int
    unit: scale
  - label: Resting Blood Pressure
    max: 250
    min: 50
    name: trestbps
    type: float
    unit: mmHg
  - label: Serum Cholestoral
    max: 600
    min: 100
    name: chol
    type: float
    unit: mg/dL
  - label: Fasting Blood Sugar > 120 mg/dL (1/0)
    max: 1
    min: 0
    name: fbs
    type: int
    unit: binary
  - label: Resting ECG Results (0-2)
    max: 2
    min: 0
    name: restecg
    type: int
    unit: scale
  - label: Maximum Heart Rate Achieved
    max: 220
    min: 60
    name: thalach
    type: float
    unit: bpm
  - label: Exercise Induced Angina (1/0)
    max: 1
    min: 0
    name: exang
    type: int
    unit: binary
  - label: ST Depression Induced by Exercise
    max: 10.0
    min: 0.0
    name: oldpeak
    type: float
    unit: mm
  - label: Slope of Peak Exercise ST Segment (0-2)
    max: 2
    min: 0
    name: slope
    type: int
    unit: scale
  - label: Number of Major Vessels (0-4)
    max: 4
    min: 0
    name: ca
    type: int
    unit: count
  - label: Thalassemia (0-3)
    max: 3
    min: 0
    name: thal
    type: int
    unit: scale
  positive_label: 0
  target_column: target
kidney_disease:
  dataset_path: datasets/Kaggle/Kidney/kidney_disease_train.csv
  disease_name: Kidney Disease
  features:
  - label: Age
    max: 120
    min: 1
    name: age
    type: float
    unit: years
  - label: Blood Pressure
    max: 200
    min: 40
    name: bp
    type: float
    unit: mmHg
  - label: Specific Gravity
    max: 1.035
    min: 1.0
    name: sg
    type: float
    unit: ratio
  - label: Albumin
    max: 5
    min: 0
    name: al
    type: float
    unit: scale
  - label: Sugar
    max: 5
    min: 0
    name: su
    type: float
    unit: scale
  - label: Red Blood Cells (normal/abnormal)
    name: rbc
    options:
    - normal
    - abnormal
    type: string
    unit: categorical
  - label: Pus Cell (normal/abnormal)
    name: pc
    options:
    - normal
    - abnormal
    type: string
    unit: categorical
  - label: Pus Cell Clumps (present/notpresent)
    name: pcc
    options:
    - notpresent
    - present
    type: string
    unit: categorical
  - label: Bacteria (present/notpresent)
    name: ba
    options:
    - notpresent
    - present
    type: string
    unit: categorical
  - label: Blood Glucose Random
    max: 500
    min: 20
    name: bgr
    type: float
    unit: mgs/dl
  - label: Blood Urea
    max: 400
    min: 1
    name: bu
    type: float
    unit: mgs/dl
  - label: Serum Creatinine
    max: 25.0
    min: 0.1
    name: sc
    type: float
    unit: mgs/dl
  - label: Sodium
    max: 180
    min: 80
    name: sod
    type: float
    unit: mEq/L
  - label: Potassium
    max: 50.0
    min: 2.0
    name: pot
    type: float
    unit: mEq/L
  - label: Hemoglobin
    max: 20.0
    min: 3.0
    name: hemo
    type: float
    unit: gms
  - label: Packed Cell Volume
    max: 60
    min: 10
    name: pcv
    type: float
    unit: '%'
  - label: White Blood Cell Count
    max: 30000
    min: 1000
    name: wc
    type: float
    unit: cells/cumm
  - label: Red Blood Cell Count
    max: 10.0
    min: 1.0
    name: rc
    type: float
    unit: millions/cmm
  - label: Hypertension (yes/no)
    name: htn
    options:
    - 'no'
    - 'yes'
    type: string
    unit: categorical
  - label: Diabetes Mellitus (yes/no)
    name: dm
    options:
    - 'no'
    - 'yes'
    type: string
    unit: categorical
  - label: Coronary Artery Disease (yes/no)
    name: cad
    options:
    - 'no'
    - 'yes'
    type: string
    unit: categorical
  - label: Appetite (good/poor)
    name: appet
    options:
    - good
    - poor
    type: string
    unit: categorical
  - label: Pedal Edema (yes/no)
    name: pe
    options:
    - 'no'
    - 'yes'
    type: string
    unit: categorical
  - label: Anemia (yes/no)
    name: ane
    options:
    - 'no'
    - 'yes'
    type: string
    unit: categorical
  positive_label: ckd
  target_column: classification
liver_disease:
  dataset_path: datasets/Kaggle/indian_liver_patient_enhanced.csv
  disease_name: Liver Disease
  features:
  - label: Age
    max: 120
    min: 1
    name: Age
    type: int
    unit: years
  - label: Gender
    name: Gender
    options:
    - Female
    - Male
    type: string
    unit: categorical
  - label: Total Bilirubin
    max: 80.0
    min: 0.1
    name: Total_Bilirubin
    type: float
    unit: mg/dL
  - label: Direct Bilirubin
    max: 30.0
    min: 0.1
    name: Direct_Bilirubin
    type: float
    unit: mg/dL
  - label: Alkaline Phosphatase
    max: 2200
    min: 50
    name: Alkaline_Phosphotase
    type: float
    unit: IU/L
  - label: Alamine Aminotransferase (ALT)
    max: 2500
    min: 10
    name: Alamine_Aminotransferase
    type: float
    unit: IU/L
  - label: Aspartate Aminotransferase (AST)
    max: 5000
    min: 10
    name: Aspartate_Aminotransferase
    type: float
    unit: IU/L
  - label: Total Proteins
    max: 12.0
    min: 2.0
    name: Total_Protiens
    type: float
    unit: g/dL
  - label: Albumin
    max: 7.0
    min: 0.5
    name: Albumin
    type: float
    unit: g/dL
  - label: Albumin / Globulin Ratio
    max: 3.5
    min: 0.1
    name: Albumin_and_Globulin_Ratio
    type: float
    unit: ratio
  positive_label: 1
  target_column: Dataset
